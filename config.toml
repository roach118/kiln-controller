[logging] # CONFIG.logging
# Python logging level (DEBUG, INFO, WARNING, ERROR, CRITICAL).
level = "INFO"
# Standard logging format string.
format = "%(asctime)s %(levelname)s %(name)s: %(message)s"

[server] # CONFIG.server
# Web UI and websocket port.
listening_port = 8081
# Lock file to prevent multiple controller instances.
lock_file = "storage/kiln-controller.lock"

[cost] # CONFIG.cost
# Cost per kWh for energy estimates.
kwh_rate = 0.1319
# Total kiln element power draw in kilowatts.
kw_elements = 9.460
# Currency symbol for display.
currency_type = "$"

[hardware] # CONFIG.hardware
# SPI pins for software SPI (bit-banged). Use board pin names (e.g., "D23").
# If these are omitted, hardware SPI is used.
spi_sclk = "D17"
spi_miso = "D27"
spi_cs = "D22"
spi_mosi = "D10"
# Relay control GPIO output pin.
gpio_heat = "D23"
# If true, invert the relay output state.
gpio_heat_invert = false

[thermocouple] # CONFIG.thermocouple
# Select which MAX3185x breakout board is attached ("max31855" or "max31856").
model = "max31855"
# Thermocouple type for MAX31856 (B, E, J, K, N, R, S, T).
type = "K"
# Set true in 50Hz locales to improve filtering.
ac_freq_50hz = false
# Error overrides (set true to ignore specific fault conditions).
ignore_tc_lost_connection = false
ignore_tc_cold_junction_range_error = false
ignore_tc_range_error = false
ignore_tc_cold_junction_temp_high = false
ignore_tc_cold_junction_temp_low = false
ignore_tc_temp_high = false
ignore_tc_temp_low = false
ignore_tc_voltage_error = false
ignore_tc_short_errors = false
ignore_tc_unknown_error = false
# Ignore all thermocouple errors and keep running (use with care).
ignore_tc_too_many_errors = false

[run] # CONFIG.run
# If kiln is already hot, skip ahead to the first matching point in the profile.
seek_start = true
# Duty cycle in seconds (longer values increase reaction time to safety events).
sensor_time_wait = 2
# Pause profile progression until temperature catches up.
kiln_must_catch_up = true
# PID control window in degrees C.
pid_control_window = 2.78
# Thermocouple temperature offset in degrees C.
thermocouple_offset = 0
# Number of samples per duty cycle for temperature smoothing.
temperature_average_samples = 10
# Max number of live points kept in memory for reconnect/backlog.
backlog_max_points = 5000
# Recent window (seconds) that keeps full-resolution live points.
backlog_older_window_seconds = 7200
# Downsample older points to this interval (seconds).
backlog_older_sample_seconds = 30
# Abort a run if the thermocouple stops reporting (seconds). Set 0 to disable.
sensor_stale_timeout_seconds = 30
# Ignore thermocouple reads near SSR state changes (milliseconds). Set 0 to disable.
ssr_quiet_window_ms = 100
# Maximum allowed temperature ramp rate (deg C/sec). Set 0 to disable filtering.
temp_ramp_max_c_per_sec = 2.0
# Number of recent samples used to count ramp anomalies.
temp_ramp_anomaly_window = 30
# Max ramp anomalies allowed within the window before aborting.
temp_ramp_anomaly_max = 5
# Abort if the control loop stalls for this many seconds. Set 0 to disable.
loop_watchdog_timeout_seconds = 10
# Reject profiles with temperatures below this value (deg C).
profile_min_temp_c = 0
# Reject profiles with temperatures above this value (deg C).
profile_max_temp_c = 1300
# Require this many consecutive good samples before enabling heat. Set 0 to disable.
safe_start_min_good_samples = 3
# Abort if safe startup does not succeed within this many seconds. Set 0 to disable.
safe_start_timeout_seconds = 30
# Temperature display unit for the UI only (internal is always C).
temp_scale = "c"
# Slope display time base: s, m, or h.
time_scale_slope = "h"
# Profile entry display time base: s, m, or h.
time_scale_profile = "m"
# Emergency shutoff temperature in degrees C.
emergency_shutoff_temp = 1240
# Ignore emergency shutoff on over-temperature (use with care).
ignore_temp_too_high = false
# Temperature below which heating is throttled (degrees C).
throttle_below_temp = 148.89
# Maximum heating percentage below the throttle temperature.
throttle_percent = 20
# Deprecated but kept for compatibility (windup is handled automatically).
stop_integral_windup = true

[pid] # CONFIG.pid
# PID tuning parameters.
pid_kp = 10
pid_ki = 80
pid_kd = 220.83497910261562

[simulation] # CONFIG.simulation
# Run in simulated mode (no hardware required).
# If hardware pins cannot be resolved on this device, simulation is forced on.
simulate = true
# Ambient/environment temperature in degrees C.
sim_t_env = 18.33
# Heat capacity of heating element (J/K).
sim_c_heat = 500.0
# Heat capacity of oven (J/K).
sim_c_oven = 5000.0
# Heating power (W).
sim_p_heat = 5450.0
# Thermal resistance oven -> environment (K/W) with no cooling.
sim_R_o_nocool = 0.5
# Thermal resistance oven -> environment (K/W) with cooling.
sim_R_o_cool = 0.05
# Thermal resistance heat element -> oven (K/W) without air circulation.
sim_R_ho_noair = 0.1
# Thermal resistance heat element -> oven (K/W) with air circulation.
sim_R_ho_air = 0.05
# Simulation speed multiplier (1 = real time).
sim_speedup_factor = 1

[restart] # CONFIG.restart
# Enable automatic restart after power loss.
automatic_restarts = true
# Max minutes since power outage to allow restart.
automatic_restart_window = 15
# State file path for restarts (relative to config.toml by default).
automatic_restart_state_file = "state.json"

[profiles] # CONFIG.profiles
# Directory containing profile JSON files (relative to config.toml by default).
kiln_profiles_directory = "storage/profiles"

[history] # CONFIG.history
# Enable history logging per firing (JSONL file per run).
enabled = true
# History log tick interval in seconds.
tick_seconds = 30
# Directory for history logs (relative to config.toml by default).
directory = "storage/history"

[security] # CONFIG.security
# PIN required to start or shut down the kiln (numeric value).
# To allow shutdown, the service user must be able to run:
#   sudo -n shutdown -h +1 "kiln-controller shutdown"
# without a password. Configure sudoers with NOPASSWD for shutdown.
pin = 1234

[safety] # CONFIG.safety
# Enable heating-stall detection when the kiln is commanded to heat.
heating_stall_enabled = true
# Window in minutes to require a minimum temperature rise.
heating_stall_window_minutes = 10
# Minimum temperature rise (deg C) required within the window.
heating_stall_min_temp_rise = 1.0
# Minimum heater output (0.0-1.0) to consider it "actively heating".
heating_stall_min_heater_output = 0.7
# Minimum target delta (deg C) before the check is applied.
heating_stall_min_target_delta = 5.0
# Ignore heating stall and keep running (use with care).
ignore_heating_stall = false
